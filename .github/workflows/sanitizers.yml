# Sanitizers and memory checkers for detecting threading issues and memory leaks.
# ASan covers memory-safety and UB in ALE's own C++; leak detection is left to
# Valgrind Memcheck, which gets usable stacks through the (non-instrumented)
# CPython interpreter and can tell a definite leak apart from interpreter-lifetime
# allocations. Valgrind Helgrind runs on releases only.

name: Sanitizers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

jobs:
  thread-sanitizer:
    name: "Thread Sanitizer"
    runs-on: ubuntu-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux-mixed
      CC: clang-18
      CXX: clang++-18

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 llvm-18

    - name: Download and unpack ROMs
      run: ./scripts/download_unpack_roms.sh

    - name: Run Thread Sanitizer
      run: ./scripts/run_sanitizers.sh thread

  address-sanitizer:
    name: "Address Sanitizer + UBSan"
    runs-on: ubuntu-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux-mixed
      CC: clang-18
      CXX: clang++-18

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 llvm-18

    - name: Download and unpack ROMs
      run: ./scripts/download_unpack_roms.sh

    - name: Run Address Sanitizer
      run: ./scripts/run_sanitizers.sh address

  valgrind-memcheck:
    name: "Valgrind Memcheck"
    runs-on: ubuntu-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux-mixed

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind

    - name: Download and unpack ROMs
      run: ./scripts/download_unpack_roms.sh

    # This is the leak gate — a definite leak fails the job (see
    # --errors-for-leak-kinds=definite in scripts/run_sanitizers.sh).
    - name: Run Valgrind Memcheck
      timeout-minutes: 360
      run: ./scripts/run_sanitizers.sh valgrind-memcheck

  valgrind-helgrind:
    name: "Valgrind Helgrind"
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux-mixed

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind

    - name: Download and unpack ROMs
      run: ./scripts/download_unpack_roms.sh

    - name: Run Valgrind Helgrind
      timeout-minutes: 360
      run: ./scripts/run_sanitizers.sh valgrind-helgrind
      continue-on-error: true
